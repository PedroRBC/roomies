# Development stack: builds everything from this checkout.
#   docker compose up --build                 # http://localhost:8080
#   docker compose run --rm test-backend      # gofmt, vet, tests
#   docker compose run --rm test-frontend     # flutter analyze + test
#   docker compose run --rm apk               # debug APK
# Works without a .env; copy .env.example to .env to change settings.
# Running Roomies rather than hacking on it? Use the compose file in the README.
name: roomies

x-backend: &backend
  build:
    context: src/server
    target: dev
  volumes:
    - ./src/server:/app:Z
    - gocache:/root/.cache/go-build
    - gomod:/go/pkg/mod
    - tls:/tls:ro
  environment:
    DATABASE_URL: postgres://roomies:${POSTGRES_PASSWORD:-roomies}@db:5432/roomies?sslmode=verify-full&sslrootcert=/tls/ca.crt
    TLS_CERT_FILE: /tls/backend.crt
    TLS_KEY_FILE: /tls/backend.key
    ROOMIES_PUBLIC_BASE_URL: ${ROOMIES_PUBLIC_BASE_URL:-http://localhost:8080}
    CORS_ALLOWED_ORIGINS: ${ROOMIES_PUBLIC_BASE_URL:-http://localhost:8080}
    AUTH_URL: https://auth:3000
    AUTH_CA_FILE: /tls/ca.crt
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-Roomies <no-reply@roomies.local>}
    SMTP_TLS: ${SMTP_TLS:-starttls}
    INVITATION_DELIVERY_KEY_ID: ${INVITATION_DELIVERY_KEY_ID:-}
    INVITATION_DELIVERY_KEY: ${INVITATION_DELIVERY_KEY:-}
    NOTIFICATION_DELIVERY_KEY_ID: ${NOTIFICATION_DELIVERY_KEY_ID:-}
    NOTIFICATION_DELIVERY_KEY: ${NOTIFICATION_DELIVERY_KEY:-}
    WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
    WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  # One-shot: private CA and certificates for TLS between containers.
  tls:
    build:
      context: src/server
      target: dev
    volumes:
      - ./src/server:/app:Z
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
      - tls:/tls
    command: ["go", "run", ".", "tls-init"]

  db:
    image: docker.io/postgres:16-alpine
    # TLS only: pg_hba.conf from tls-init rejects plaintext TCP connections.
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls/db.crt", "-c", "ssl_key_file=/tls/db.key",
      "-c", "ssl_min_protocol_version=TLSv1.2", "-c", "hba_file=/tls/pg_hba.conf"]
    environment:
      POSTGRES_USER: roomies
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomies}
      POSTGRES_DB: roomies
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - tls:/tls:ro
    depends_on:
      tls:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomies -d roomies"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # API and background worker: `go run` on the mounted src/server.
  # After changing Go code: docker compose restart backend worker
  backend:
    <<: *backend
    command: ["go", "run", ".", "serve"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  worker:
    <<: *backend
    command: ["go", "run", ".", "worker"]

  auth:
    build:
      context: src/auth
      target: runtime
    environment:
      DATABASE_URL: postgres://roomies:${POSTGRES_PASSWORD:-roomies}@db:5432/roomies
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      ROOMIES_PUBLIC_BASE_URL: ${ROOMIES_PUBLIC_BASE_URL:-http://localhost:8080}
    volumes:
      - tls:/tls:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const https=require('https'),fs=require('fs');https.get('https://localhost:3000/api/auth/ok',{ca:fs.readFileSync('/tls/ca.crt')},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  test-auth:
    profiles: [tools]
    build:
      context: src/auth
      target: tools
    environment:
      AUTH_TEST_DATABASE_URL: postgres://roomies:${POSTGRES_PASSWORD:-roomies}@db:5432/roomies?sslmode=verify-full&sslrootcert=/tls/ca.crt
    volumes:
      - tls:/tls:ro
    depends_on:
      backend:
        condition: service_healthy

  # Flutter web bundle built from src/app, served by Caddy next to the API.
  # After changing the app: docker compose up --build -d web
  web:
    build:
      context: src/app
      target: local
    ports:
      # HTTP_PORT must match the port in ROOMIES_PUBLIC_BASE_URL.
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - tls:/tls:ro
    depends_on:
      auth:
        condition: service_healthy
    restart: unless-stopped

  # Alternative web client; explicitly select it instead of web (same port).
  web-vite:
    profiles: [vite]
    build:
      context: src/web
      target: local
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - tls:/tls:ro
    depends_on:
      auth:
        condition: service_healthy
    restart: unless-stopped

  test-web:
    profiles: [tools]
    build:
      context: src/web
      target: tools

  # Tooling: nothing to install on the host.
  test-backend:
    profiles: [tools]
    build:
      context: src/server
      target: dev
    volumes:
      - ./src/server:/app:Z
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
      - tls:/tls:ro
    environment:
      DATABASE_URL: postgres://roomies:${POSTGRES_PASSWORD:-roomies}@db:5432/roomies?sslmode=verify-full&sslrootcert=/tls/ca.crt
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", 'test -z "$$(gofmt -l .)" && go vet ./... && go test ./...']

  test-frontend:
    profiles: [tools]
    image: ghcr.io/cirruslabs/flutter:3.27.1
    volumes:
      - ./src/app:/workspace:Z
    working_dir: /workspace
    command: ["bash", "-lc", "flutter pub get && flutter analyze && flutter test"]

  # Debug APK; it asks for a server on first launch.
  # Output: src/app/build/app/outputs/flutter-apk/
  apk:
    profiles: [tools]
    image: ghcr.io/cirruslabs/flutter:3.27.1
    volumes:
      - ./src/app:/workspace:Z
    working_dir: /workspace
    command: ["bash", "-lc", "flutter pub get && flutter build apk --debug --dart-define=ROOMIES_API_URL="]

volumes:
  pgdata:
  gocache:
  gomod:
  tls:
